name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pinned Node.js
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - name: Test managed Node launcher
        run: node --test scripts/node.integration.mjs
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build and test without model requests
        run: pnpm test
